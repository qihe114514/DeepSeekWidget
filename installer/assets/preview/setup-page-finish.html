<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek 余额小组件 安装程序</title>
<style>
  :root {
    --ink: #182235;
    --muted: #6d788b;
    --line: #dce4ef;
    --panel: #f5f8fc;
    --blue: #2f80ed;
    --blue-dark: #236fd5;
    --green: #20a464;
    --red: #d84b4b;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { color: var(--ink); font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; background: #edf2f8; }
  button, input { font: inherit; }
  .titlebar { height: 38px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5ebf2; background: #f8fafc; user-select: none; }
  .title-drag { align-self: stretch; flex: 1; display: flex; align-items: center; gap: 9px; padding: 0 12px; -webkit-app-region: drag; }
  .titlebar img { width: 20px; height: 20px; }
  .titlebar span { color: #334157; font-size: 12px; font-weight: 600; }
  .window-actions { display: flex; align-self: stretch; }
  .window-actions button { width: 46px; border: 0; background: transparent; color: #4a586c; font-size: 16px; cursor: pointer; }
  .window-actions button:hover { background: #e8eef5; }
  .window-actions .close:hover { background: #d94b4b; color: #fff; }
  .shell { display: grid; grid-template-columns: 232px 1fr; width: 100%; height: calc(100% - 38px); background: #fff; }
  .sidebar { position: relative; overflow: hidden; color: #fff; background: linear-gradient(160deg, #111923 0%, #19283a 58%, #0e151e 100%); }
  .sidebar::before { content: ""; position: absolute; left: -78px; bottom: -86px; width: 205px; height: 205px; border-radius: 50%; background: rgba(54, 112, 174, .30); }
  .sidebar::after { content: ""; position: absolute; right: 0; top: 0; width: 3px; height: 100%; background: linear-gradient(#2f80ed, #55a7ff); }
  .brand { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 58px 24px 0; text-align: center; }
  .brand img { width: 84px; height: 84px; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .26)); }
  .brand h1 { margin: 20px 0 0; font-size: 18px; line-height: 1.35; letter-spacing: .02em; }
  .brand p { margin: 8px 0 0; color: #aebbd0; font-size: 13px; line-height: 1.6; }
  .steps { position: absolute; z-index: 1; left: 34px; right: 34px; bottom: 28px; display: grid; gap: 12px; }
  .step { display: flex; align-items: center; gap: 10px; color: #8996aa; font-size: 12px; }
  .step .dot { width: 18px; height: 18px; display: grid; place-items: center; border: 1px solid #59677a; border-radius: 50%; font-size: 10px; transition: .2s ease; }
  .step.active { color: #fff; }
  .step.active .dot { border-color: #61b0ff; background: #2f80ed; box-shadow: 0 0 0 4px rgba(47,128,237,.16); }
  .step.done .dot { border-color: #4fa4f8; color: #fff; background: #2f80ed; }
  .main { display: grid; grid-template-rows: 1fr 68px; min-width: 0; }
  .content { min-height: 0; overflow: auto; padding: 38px 44px 24px; }
  .eyebrow { margin-bottom: 8px; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  h2 { margin: 0; font-size: 24px; line-height: 1.3; }
  .lead { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .license { height: 255px; margin-top: 20px; padding: 20px 22px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; color: #3d485a; font-size: 13px; line-height: 1.85; }
  .license h3 { margin: 0 0 12px; color: #23324a; font-size: 15px; }
  .license p { margin: 0 0 13px; }
  .accept { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: #3c485b; font-size: 13px; cursor: pointer; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blue); }
  .field { margin-top: 20px; }
  .field label { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 700; }
  .path-row { display: grid; grid-template-columns: 1fr 84px; gap: 10px; }
  .path-row input { min-width: 0; height: 42px; padding: 0 13px; border: 1px solid #cbd6e4; border-radius: 9px; outline: none; background: #fff; color: #253148; }
  .path-row input:focus { border-color: #78b4f7; box-shadow: 0 0 0 3px rgba(47,128,237,.12); }
  .options { display: grid; gap: 12px; margin-top: 26px; }
  .option { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fbfcfe; cursor: pointer; }
  .option:hover { border-color: #b9d3f2; background: #f7fbff; }
  .option strong { display: block; font-size: 13px; }
  .option span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .summary { margin-top: 22px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .summary-row { display: grid; grid-template-columns: 122px 1fr; gap: 14px; padding: 13px 16px; border-bottom: 1px solid #e8edf4; font-size: 13px; }
  .summary-row:last-child { border-bottom: 0; }
  .summary-key { color: var(--muted); }
  .summary-value { color: #243148; font-weight: 600; word-break: break-all; }
  .progress-wrap { margin-top: 42px; }
  .progress-track { height: 12px; overflow: hidden; border-radius: 999px; background: #e3eaf3; }
  .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2f80ed, #61b0ff); transition: width .35s ease; }
  .progress-info { display: flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 12px; }
  .status { margin-top: 24px; padding: 18px; border-radius: 12px; background: #f6f9fd; color: #46536a; font-size: 13px; line-height: 1.7; }
  .result { display: grid; place-items: center; margin-top: 30px; text-align: center; }
  .result-icon { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--green); font-size: 38px; }
  .result.error .result-icon { background: var(--red); }
  .result h3 { margin: 18px 0 8px; font-size: 21px; }
  .result p { max-width: 510px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.75; }
  .log-path { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #f2f5f9; color: #566276; font-family: Consolas, monospace; font-size: 11px; word-break: break-all; }
  .footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 34px; border-top: 1px solid #e6ebf2; background: #fbfcfe; }
  .footer .spacer { flex: 1; }
  .btn { min-width: 88px; height: 38px; padding: 0 18px; border: 1px solid #cfd8e5; border-radius: 8px; background: #fff; color: #354258; cursor: pointer; transition: .15s ease; }
  .btn:hover { border-color: #a9bfd9; background: #f8fbff; }
  .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
  .btn.primary:hover { border-color: var(--blue-dark); background: var(--blue-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .hidden { display: none !important; }
</style>
<script>window.chrome=window.chrome||{};window.chrome.webview=window.chrome.webview||{postMessage:function(m){console.log("mock",m);},addEventListener:function(){}};</script></head>

          <div class="eyebrow">Step 02</div>
          <h2>选择安装位置与快捷方式</h2>
          <p class="lead">所有设置都可以在安装前修改，不会在后台偷偷写入额外内容。</p>
          <div class="field">
            <label for="folder">安装目录</label>
            <div class="path-row">
              <input id="folder" value="${esc(state.folder)}">
              <button class="btn" id="browse">浏览...</button>
            </div>
          </div>
          <div class="options">
            <label class="option"><div><strong>创建开始菜单快捷方式</strong><span>在开始菜单中显示 DeepSeek 余额小组件</span></div><input type="checkbox" id="startMenu" ${state.startMenu ? 'checked' : ''}></label>
            <label class="option"><div><strong>创建桌面快捷方式</strong><span>在桌面显示快速启动图标</span></div><input type="checkbox" id="desktop" ${state.desktop ? 'checked' : ''}></label>
            <label class="option"><div><strong>开机自动启动</strong><span>登录 Windows 后自动运行小组件</span></div><input type="checkbox" id="autoStart" ${state.autoStart ? 'checked' : ''}></label>
          </div>`;
        document.getElementById('browse').onclick = () => post({ type: 'browse', folder: state.folder });
        document.getElementById('folder').onchange = event => state.folder = event.target.value.trim();
        document.getElementById('startMenu').onchange = event => state.startMenu = event.target.checked;
        document.getElementById('desktop').onchange = event => state.desktop = event.target.checked;
        document.getElementById('autoStart').onchange = event => state.autoStart = event.target.checked;
      } else if (state.page === 2) {
        const yes = value => value ? '创建' : '不创建';
        content.innerHTML = `
          <div class="eyebrow">Step 03</div>
          <h2>确认安装设置</h2>
          <p class="lead">点击“开始安装”后，安装过程由 Windows Installer 在后台执行。</p>
          <div class="summary">
            <div class="summary-row"><div class="summary-key">安装目录</div><div class="summary-value">${esc(state.folder)}</div></div>
            <div class="summary-row"><div class="summary-key">开始菜单</div><div class="summary-value">${yes(state.startMenu)}</div></div>
            <div class="summary-row"><div class="summary-key">桌面快捷方式</div><div class="summary-value">${yes(state.desktop)}</div></div>
            <div class="summary-row"><div class="summary-key">开机自动启动</div><div class="summary-value">${yes(state.autoStart)}</div></div>
          </div>`;
      } else if (state.page === 3) {
        content.innerHTML = `
          <div class="eyebrow">Step 04</div>
          <h2>${state.failed ? '安装没有完成' : '正在安装 DeepSeek 余额小组件'}</h2>
          <p class="lead">${state.failed ? '请查看下面的错误信息。' : '请不要关闭窗口，安装完成后会自动进入下一步。'}</p>
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
            <div class="progress-info"><span id="progressText">准备开始...</span><span id="progressPercent">0%</span></div>
          </div>
          <div class="status" id="statusText">正在准备安装程序...</div>
          <div class="log-path hidden" id="logPath"></div>`;
      } else {
        const resultClass = state.failed ? 'result error' : 'result';
        content.innerHTML = `
          <div class="${resultClass}">
            <div class="result-icon">${state.failed ? '!' : '✓'}</div>
            <h3>${state.failed ? '安装失败' : '安装完成'}</h3>
            <p>${state.failed ? 'Windows Installer 返回了错误。你可以查看日志，或稍后重新运行安装程序。' : 'DeepSeek 余额小组件已经安装到你的电脑上。'}</p>
            ${state.failed ? `<div class="log-path" id="logPath">${esc(state.logPath || '')}</div>` : ''}
          </div>
          ${state.failed ? '' : `<label class="accept" style="justify-content:center;margin-top:30px"><input type="checkbox" id="launch" ${state.launch ? 'checked' : ''}> 安装完成后启动 DeepSeek 余额小组件</label>`}`;
        if (!state.failed) {
          document.getElementById('launch').onchange = event => state.launch = event.target.checked;
        }
      }
      btnBack.classList.toggle('hidden', state.page === 0 || state.page >= 3);
      btnNext.classList.toggle('hidden', state.page >= 2);
      btnInstall.classList.toggle('hidden', state.page !== 2);
      btnFinish.classList.toggle('hidden', !(state.page === 4));
      btnCancel.classList.toggle('hidden', state.page >= 3);
      btnBack.disabled = state.installing;
      btnNext.disabled = state.installing || (state.page === 0 && !state.accepted);
      btnInstall.disabled = state.installing;
    }

    function go(delta) {
      if (state.installing) return;
      const next = state.page + delta;
      if (next < 0 || next > 4) return;
      state.page = next;
      render();
    }

    btnBack.onclick = () => go(-1);
    btnNext.onclick = () => go(1);
    btnCancel.onclick = () => post({ type: 'cancel' });
    btnInstall.onclick = () => {
      const folder = document.getElementById('folder')?.value?.trim();
      if (folder) state.folder = folder;
      state.installing = true;
      state.page = 3;
      render();
      post({ type: 'install', folder: state.folder, startMenu: state.startMenu, desktop: state.desktop, autoStart: state.autoStart });
    };
    btnFinish.onclick = () => {
      if (state.failed) { post({ type: 'close' }); return; }
      post({ type: 'finish', launch: state.launch });
    };

    window.chrome.webview.addEventListener('message', event => {
      const msg = event.data;
      if (msg.type === 'directory') {
        state.folder = msg.path;
        if (state.page === 1) render();
      } else if (msg.type === 'status') {
        const progress = Math.max(0, Math.min(100, Number(msg.progress) || 0));
        state.page = 3;
        state.installing = true;
        render();
        const bar = document.getElementById('progressBar');
        const text = document.getElementById('progressText');
        const percent = document.getElementById('progressPercent');
        const status = document.getElementById('statusText');
        if (bar) bar.style.width = progress + '%';
        if (text) text.textContent = msg.message || '正在安装...';
        if (percent) percent.textContent = progress + '%';
        if (status) status.textContent = msg.detail || msg.message || '正在安装...';
      } else if (msg.type === 'complete') {
        state.installing = false;
        state.installed = true;
        state.failed = !msg.success;
        state.logPath = msg.logPath || '';
        state.page = 4;
        render();
      }
    });

    document.getElementById('dragArea').addEventListener('pointerdown', event => { if (event.button === 0) post({ type: 'window-drag' }); });
    document.getElementById('winMin').onclick = () => post({ type: 'window-minimize' });
    document.getElementById('winClose').onclick = () => post({ type: 'window-close' });
    render();
  </script>
</body>
</html>
